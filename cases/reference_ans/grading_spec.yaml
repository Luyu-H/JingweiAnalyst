# What src/eval/evaluate.py grades in each task, and to what precision.
#
# Each entry selects a result requested by the task's query from
# <task>/answer_<task>.json and specifies its scoring precision and type.
# Only the entries below are scored here; narrative findings, figures and
# supplementary diagnostics such as threshold_sensitivity are excluded.
# Reference values are read from the selected answer fields at evaluation time;
# full_precision fields are not substituted automatically. Regenerated answers
# are picked up without editing this file when their selected paths stay the same.
#
# Fields of an entry:
#   path         dot-separated keys into the answer JSON. A segment {name} expands
#                over every key of a mapping, or every position of a list (counted
#                from 1), and binds that key to {name}; a literal number indexes a
#                list from 0. Each expansion is one graded item, whose id is the
#                path with the bindings filled in.
#   description  what the value is, shown to the language model that reads the
#                agent's answer; {name} placeholders are filled from the path.
#   unit         the unit, or for non-numeric items the format the value is given in.
#   type         number (default): graded by precision and relative error.
#                integer | boolean | list | text: graded by exact match only.
#   decimals     for numbers: decimal places the task asks for, or
#   sig_figs     significant figures the task asks for.
#   transform    longitude: both values are wrapped into [-180, 180) first.

T1:
  - path: nino34_std_degC.{source}
    description: "{source}: standard deviation (ddof=0) of the monthly Nino 3.4 anomaly over all 780 months, 1950-2014"
    unit: degC
    decimals: 2
  - path: amplitude_bias_degC.{model}
    description: "{model}: amplitude bias, model minus ERSSTv5 Nino 3.4 standard deviation"
    unit: degC
    decimals: 2
  - path: amplitude_ratio.{model}
    description: "{model}: amplitude ratio, model divided by ERSSTv5 Nino 3.4 standard deviation"
    unit: "1"
    decimals: 2
  - path: ranking_by_abs_amplitude_bias
    description: "the three models ordered from smallest to largest absolute amplitude bias"
    unit: model names, smallest |bias| first
    type: list
  - path: monthly_std_degC.{source}.{month}
    description: "{source}: standard deviation of the Nino 3.4 anomaly within calendar month {month} across the 65 years"
    unit: degC
    decimals: 2
  - path: phase_locking.{source}.peak_month
    description: "{source}: calendar month of the largest monthly standard deviation"
    unit: month number, 1 = January ... 12 = December
    type: integer
  - path: phase_locking.{source}.peak_std_degC
    description: "{source}: the largest monthly standard deviation (the value at the peak month)"
    unit: degC
    decimals: 2
  - path: phase_locking.{source}.trough_month
    description: "{source}: calendar month of the smallest monthly standard deviation"
    unit: month number, 1 = January ... 12 = December
    type: integer
  - path: phase_locking.{source}.locking_ratio
    description: "{source}: phase-locking ratio, largest divided by smallest monthly standard deviation"
    unit: "1"
    decimals: 2
  - path: exceedance_percent_abs_gt_1.{source}
    description: "{source}: percentage of the 780 months with |Nino 3.4 anomaly| strictly greater than 1.0 degC"
    unit: "%"
    decimals: 1
  - path: exceedance_count_abs_gt_1.{source}
    description: "{source}: number of the 780 months with |Nino 3.4 anomaly| strictly greater than 1.0 degC"
    unit: count
    decimals: 0

T2:
  - path: pearson_r_recon_vs_cpc
    description: "Pearson correlation between RECON_9120 and the CPC 1991-2020 Nino 3.4 anomaly, 1950-01 to 2023-12"
    unit: "1"
    decimals: 6
  - path: rmse_recon_vs_cpc_degC
    description: "RMSE of RECON_9120 against the CPC 1991-2020 Nino 3.4 anomaly, 1950-01 to 2023-12"
    unit: degC
    decimals: 4
  - path: max_abs_deviation_degC
    description: "largest absolute monthly deviation of RECON_9120 from the CPC 1991-2020 series"
    unit: degC
    decimals: 4
  - path: max_abs_deviation_at
    description: "the year and month at which that largest absolute deviation of RECON_9120 from CPC occurs"
    unit: YYYY-MM
    type: text
  - path: n_el_nino_recon
    description: "number of El Nino events in RECON_9120 over 1950-2023 under the ONI criterion"
    unit: count
    decimals: 0
  - path: top3_el_nino_recon.{rank}.peak_time
    description: "RECON_9120: year and month of the peak of the El Nino event ranked {rank} by peak value (1 = highest peak)"
    unit: YYYY-MM
    type: text
  - path: top3_el_nino_recon.{rank}.peak_value_degC
    description: "RECON_9120: peak value of the El Nino event ranked {rank} by peak value (1 = highest peak)"
    unit: degC
    decimals: 2
  - path: n_el_nino_cpc_oni
    description: "number of El Nino events in the CPC ONI series over 1950-2023 under the identical criterion"
    unit: count
    decimals: 0
  - path: top3_el_nino_cpc_oni.{rank}.peak_time
    description: "CPC ONI: year and month of the peak of the El Nino event ranked {rank} by peak value (1 = highest peak)"
    unit: YYYY-MM
    type: text
  - path: top3_el_nino_cpc_oni.{rank}.peak_value_degC
    description: "CPC ONI: peak value of the El Nino event ranked {rank} by peak value (1 = highest peak)"
    unit: degC
    decimals: 2
  - path: baseline_offset_reconstructed_degC
    description: "mean reconstructed baseline offset, RECON_8110 minus RECON_9120, over 1950-01 to 2020-12"
    unit: degC
    decimals: 3
  - path: baseline_offset_published_degC
    description: "mean published baseline offset, CPC 1981-2010 minus CPC 1991-2020 Nino 3.4 anomaly, over 1950-01 to 2020-12"
    unit: degC
    decimals: 3

T3:
  - path: native_global_mean_sst_degC.{model}
    description: "{model}: area-weighted global mean of the 1971-2000 SST climatology over the model's own native ocean grid (weighted by its areacello)"
    unit: degC
    decimals: 2
  - path: woa23_global_mean_sst_degC
    description: "WOA23: area-weighted global mean of the 1971-2000 annual 0 m temperature over the whole 1-degree grid (its own ocean mask, not the common mask)"
    unit: degC
    decimals: 2
  - path: common_mask_mean_sst_degC.{source}
    description: "{source}: area-weighted mean SST over the common comparison mask on the WOA23 1-degree grid (models conservatively remapped)"
    unit: degC
    decimals: 2
  - path: delta_sst_degC.{model}
    description: "{model}: area-weighted mean bias delta_SST (model minus WOA23) over the common comparison mask"
    unit: degC
    decimals: 2
  - path: rmse_degC.{model}
    description: "{model}: area-weighted RMSE against WOA23 over the common comparison mask"
    unit: degC
    decimals: 3
  - path: pattern_correlation.{model}
    description: "{model}: area-weighted spatial Pearson correlation with WOA23 over the common comparison mask"
    unit: "1"
    decimals: 3
  - path: ranking_by_abs_delta_sst
    description: "the three models ordered from smallest to largest absolute delta_SST"
    unit: model names, smallest |delta_SST| first
    type: list

T4:
  - path: results.{model}.{month}.mean_difference_m
    description: "{model}, {month} 1971-2000 climatology: area-weighted mean difference, operator MLD minus mlotst"
    unit: m
    decimals: 1
  - path: results.{model}.{month}.rmsd_m
    description: "{model}, {month} 1971-2000 climatology: area-weighted root-mean-square difference between operator MLD and mlotst"
    unit: m
    decimals: 1
  - path: results.{model}.{month}.spatial_correlation
    description: "{model}, {month} 1971-2000 climatology: area-weighted spatial Pearson correlation between operator MLD and mlotst"
    unit: "1"
    decimals: 3
  - path: results.{model}.{month}.area_percent_abs_diff_gt_20m
    description: "{model}, {month}: percentage of the area where both fields are defined on which |operator MLD minus mlotst| exceeds 20 m"
    unit: "%"
    decimals: 1
  - path: results.{model}.{month}.shared_area_percent_of_ocean
    description: "{model}, {month}: area where both fields are defined, as a percentage of the model's total ocean area"
    unit: "%"
    decimals: 1
  - path: consistency_ranking
    description: "the three models ordered from most to least internally consistent (operator MLD vs mlotst)"
    unit: model names, most consistent first
    type: list

T5:
  - path: woa23_global_mean_sss_psu
    description: "WOA23: global area-weighted mean 1971-2000 sea surface salinity"
    unit: psu
    decimals: 2
  - path: global_mean_sss_psu.{model}
    description: "{model}: global area-weighted mean 1971-2000 sea surface salinity on its native ocean grid"
    unit: psu
    decimals: 2
  - path: mean_state_bias_psu.{model}
    description: "{model}: global mean SSS difference, model minus WOA23"
    unit: psu
    decimals: 2
  - path: rmse_vs_woa23_psu.{model}
    description: "{model}: area-weighted RMSE of SSS against WOA23 on the shared 1-degree comparison mask"
    unit: psu
    decimals: 2
  - path: spatial_correlation_vs_woa23.{model}
    description: "{model}: area-weighted spatial Pearson correlation of SSS with WOA23 on the shared 1-degree comparison mask"
    unit: "1"
    decimals: 3
  - path: trends_psu_per_decade.{model}.{experiment}.slope
    description: "{model}, {experiment} (historical = 1950-2014, ssp245 = 2071-2100): linear trend of the annual global mean SSS"
    unit: psu per decade
    sig_figs: 3
  - path: trends_psu_per_decade.{model}.{experiment}.ci95.0
    description: "{model}, {experiment} (historical = 1950-2014, ssp245 = 2071-2100): LOWER bound of the 95% confidence interval of the SSS trend"
    unit: psu per decade
    sig_figs: 3
  - path: trends_psu_per_decade.{model}.{experiment}.ci95.1
    description: "{model}, {experiment} (historical = 1950-2014, ssp245 = 2071-2100): UPPER bound of the 95% confidence interval of the SSS trend"
    unit: psu per decade
    sig_figs: 3
  - path: trends_psu_per_decade.{model}.{experiment}.r2
    description: "{model}, {experiment} (historical = 1950-2014, ssp245 = 2071-2100): R-squared of the SSS trend fit"
    unit: "1"
    decimals: 3
  - path: trends_psu_per_decade.{model}.{experiment}.ci_excludes_zero
    description: "{model}, {experiment} (historical = 1950-2014, ssp245 = 2071-2100): whether the 95% confidence interval of the SSS trend excludes zero"
    unit: true or false
    type: boolean
  - path: trend_ratio_ssp245_over_historical.{model}.ratio
    description: "{model}: ratio of the ssp245 SSS trend slope to the historical slope"
    unit: "1"
    decimals: 1
  - path: delta_sss_psu.{model}.{region}
    description: "{model}: area-weighted mean change delta SSS (ssp245 2071-2100 minus historical 1995-2014) over the {region} ocean"
    unit: psu
    decimals: 2

T6:
  - path: global_mean_nitracline_depth_m.{source}
    description: "{source}: global area-weighted mean nitracline depth on its own native grid"
    unit: m
    decimals: 0
  - path: global_bias_m.{model}
    description: "{model}: global mean nitracline depth difference, model minus WOA23"
    unit: m
    decimals: 0
  - path: basin_mean_nitracline_depth_m.{source}.{basin}
    description: "{source}: area-weighted mean nitracline depth in the {basin} Ocean"
    unit: m
    decimals: 0
  - path: basin_bias_m.{model}.{basin}
    description: "{model}: {basin} Ocean mean nitracline depth difference, model minus WOA23"
    unit: m
    decimals: 0
  - path: spatial_correlation.{model}
    description: "{model}: area-weighted spatial Pearson correlation of the nitracline depth with WOA23 on the shared 1-degree mask"
    unit: "1"
    decimals: 3
  - path: rmse_m.{model}
    description: "{model}: area-weighted RMSE of the nitracline depth against WOA23 on the shared 1-degree mask"
    unit: m
    decimals: 1
  - path: basin_ordering_match.{model}
    description: "{model}: whether the model reproduces the observed ordering of nitracline depth across the Pacific, Atlantic and Indian basins"
    unit: true or false
    type: boolean

T7:
  - path: mean_np_ratio_of_cell_ratios.{source}
    description: "{source}, 200-1000 m: volume-weighted mean of the cell-by-cell N:P ratio (the headline value)"
    unit: "1"
    decimals: 2
  - path: mean_np_ratio_of_means.{source}
    description: "{source}, 200-1000 m: ratio of the volume-weighted mean nitrate to the volume-weighted mean phosphate"
    unit: "1"
    decimals: 2
  - path: regression.{source}.slope_a
    description: "{source}, 200-1000 m: slope a of the OLS regression NO3 = a * PO4 + b"
    unit: "1"
    decimals: 2
  - path: regression.{source}.intercept_b_umol_per_kg
    description: "{source}, 200-1000 m: intercept b of the OLS regression NO3 = a * PO4 + b"
    unit: umol/kg
    decimals: 2
  - path: regression.{source}.r2
    description: "{source}, 200-1000 m: R-squared of the OLS regression NO3 = a * PO4 + b"
    unit: "1"
    decimals: 3
  - path: volume_percent_within_redfield_band.{source}
    description: "{source}, 200-1000 m: percentage of water volume with N:P strictly between 14 and 18"
    unit: "%"
    decimals: 1
  - path: basin_mean_np.{source}.{basin}
    description: "{source}, 200-1000 m: volume-weighted mean N:P in the {basin} Ocean"
    unit: "1"
    decimals: 2
  - path: volume_percent_np_below_12.{source}.{region}
    description: "{source}, 200-1000 m: percentage of water volume with N:P below 12, over the {region} ocean"
    unit: "%"
    decimals: 1

T8:
  - path: surface_means.DIC.{source}
    description: "{source}: global volume-weighted mean DIC over 0-50 m"
    unit: umol/kg
    decimals: 0
  - path: surface_bias.DIC.{model}
    description: "{model}: 0-50 m global volume-weighted mean DIC difference, model minus GLODAP"
    unit: umol/kg
    decimals: 0
  - path: surface_means.TAlk.{source}
    description: "{source}: global volume-weighted mean total alkalinity over 0-50 m"
    unit: umol/kg
    decimals: 0
  - path: surface_bias.TAlk.{model}
    description: "{model}: 0-50 m global volume-weighted mean total alkalinity difference, model minus GLODAP"
    unit: umol/kg
    decimals: 0
  - path: surface_means.pH.{source}
    description: "{source}: global volume-weighted mean pH (total scale) over 0-50 m"
    unit: "1"
    decimals: 3
  - path: surface_bias.pH.{model}
    description: "{model}: 0-50 m global volume-weighted mean pH difference, model minus GLODAP"
    unit: "1"
    decimals: 3
  - path: dic_pattern_metrics.{model}.bias_umol_per_kg
    description: "{model}: area-weighted mean bias of the 0-50 m mean DIC map against GLODAP on the shared 1-degree comparison mask"
    unit: umol/kg
    decimals: 0
  - path: dic_pattern_metrics.{model}.rmse_umol_per_kg
    description: "{model}: area-weighted RMSE of the 0-50 m mean DIC map against GLODAP on the shared 1-degree comparison mask"
    unit: umol/kg
    decimals: 0
  - path: dic_pattern_metrics.{model}.spatial_correlation
    description: "{model}: area-weighted spatial correlation of the 0-50 m mean DIC map with GLODAP on the shared 1-degree comparison mask"
    unit: "1"
    decimals: 3
  - path: dic_bias_profile_umol_per_kg.{model}.{depth}
    description: "{model}: global area-weighted mean DIC bias (model minus GLODAP) at {depth} m depth"
    unit: umol/kg
    decimals: 0
  - path: dic_period_change.{model}.change_2002_minus_1971_2000
    description: "{model}: period change of the global volume-weighted 0-50 m mean DIC, 2002 minus the 1971-2000 average"
    unit: umol/kg
    decimals: 0
  - path: dic_period_change.{model}.period_change_as_fraction_of_bias
    description: "{model}: ratio of that DIC period change to the model's 0-50 m DIC difference from GLODAP"
    unit: "1"
    decimals: 2

T9:
  - path: explained_variance_percent.{source}
    description: "{source}: percentage of North Pacific SST anomaly variance explained by the leading EOF (PDO mode)"
    unit: "%"
    decimals: 1
  - path: amplitude_degC_per_sd.{source}
    description: "{source}: PDO amplitude, area-weighted RMS of the SST pattern regressed on the standardized index"
    unit: degC per standard deviation
    decimals: 3
  - path: lag1yr_autocorrelation.{source}
    description: "{source}: lag-1-year (12-month) autocorrelation of the monthly standardized PDO index"
    unit: "1"
    decimals: 3
  - path: recon_vs_published_r
    description: "Pearson correlation of the ERSSTv5-derived PDO index with the published PDO series"
    unit: "1"
    decimals: 3
  - path: pattern_correlation_vs_obs.{model}
    description: "{model}: area-weighted spatial Pearson correlation of its PDO regression pattern with the ERSSTv5 pattern"
    unit: "1"
    decimals: 3
  - path: phase_transition_years
    description: "observed (ERSSTv5) PDO phase-transition years over 1950-2014, from the sign changes of the 9-year centred running mean"
    unit: list of years in chronological order
    type: list

T10:
  - path: omz_volume_1e15_m3.{source}.{threshold}
    description: "{source}: total volume of water with oxygen strictly below {threshold} umol/kg"
    unit: 1e15 m3
    sig_figs: 3
  - path: max_thickness.{source}.thickness_m
    description: "{source}: maximum OMZ thickness at the 60 umol/kg threshold (summed thickness of sub-60 water in a column)"
    unit: m
    decimals: 1
  - path: max_thickness.{source}.latitude
    description: "{source}: latitude of the maximum OMZ thickness at the 60 umol/kg threshold"
    unit: degrees north
    decimals: 2
  - path: max_thickness.{source}.longitude
    description: "{source}: longitude of the maximum OMZ thickness at the 60 umol/kg threshold"
    unit: degrees east
    decimals: 2
    transform: longitude
  - path: scenario_volume_change_percent.{model}.{threshold}
    description: "{model}: percentage change in OMZ volume (oxygen below {threshold} umol/kg) from historical 1971-2000 to ssp245 2071-2100, positive for an expanding OMZ"
    unit: "%"
    decimals: 2
  - path: oxygen_inventory_mol.{source}
    description: "{source}: total dissolved oxygen inventory of the global ocean"
    unit: mol
    sig_figs: 3
  - path: omz_volume_by_basin_1e15_m3.{source}.{basin}
    description: "{source}: OMZ volume (oxygen below 60 umol/kg) in the {basin} Ocean"
    unit: 1e15 m3
    sig_figs: 3
  - path: observed_omz_character.mean_aou_umol_per_kg
    description: "WOA23: volume-weighted mean apparent oxygen utilization inside the observed OMZ at the 60 umol/kg threshold"
    unit: umol/kg
    decimals: 1
  - path: observed_omz_character.mean_percent_saturation
    description: "WOA23: volume-weighted mean percent oxygen saturation inside the observed OMZ at the 60 umol/kg threshold"
    unit: "%"
    decimals: 1

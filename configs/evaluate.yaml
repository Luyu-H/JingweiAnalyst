# Configuration for src/eval/evaluate.py, which scores one folder of agent runs against
# the reference answers:
#
#   python -m src.eval.evaluate
#   python -m src.eval.evaluate --config configs/evaluate.yaml --result-dir results/<run>
#
# The scores are written to <result_dir>/<output_file>. Relative paths are resolved
# against the repository root, not the working directory.

# The folder of runs to score: one <task>_<model>_<timestamp> session folder per case
# run, as the batch runner writes them (T3_deepseek-flash_20261010_173007, ...).
# When a task was run more than once, every run is scored and the task's numbers are
# their mean and standard deviation; the k-th run of every task, by the timestamp in
# the folder name, forms repeat k. --result-dir on the command line overrides this.

result_dir: ./results/gpt-5.4_kbstripped_full_20261024

# The file of each run's last turn that holds the agent's final answer.
answer_file: solution.md

# Written into result_dir. With extractor.reuse_extraction it is also read back.
output_file: evaluation.json

# Reference answers, read as <reference_dir>/<task>/answer_<task>.json.
reference_dir: ./cases/reference_ans

# Which values of each reference answer are graded, and to what precision.
grading_spec: ./cases/reference_ans/grading_spec.yaml

# Tasks to score, e.g. [T1, T2, T3]. null scores every task in the grading spec.
# A task with no run in result_dir is listed as missing and left out of the means.
tasks: null

# Difficulty levels: answer rate and accuracy are also reported for each level, as the
# mean over its tasks (and the standard deviation across repeats). A task belongs to
# at most one level; null or {} reports no levels.
difficulty_levels:
  level1: [T1, T2]
  level2: [T3, T4]
  level3: [T5, T6, T7]
  level4: [T8, T9, T10]

scoring:
  # An item counts as correct when its value, rounded to the precision the task asks
  # for, equals the reference value, or when its relative error
  # |value - reference| / |reference| is below this tolerance. 0.05 means 5 %.
  relative_tolerance: 0.0

  # Different tolerances for some items, keyed by "<task>/<item id>"; shell-style
  # wildcards are allowed and the first matching pattern wins. Item ids are the
  # grading-spec paths with their keys filled in, as listed in the output file.
  # Example:
  #   "T2/pearson_r_recon_vs_cpc": 1.0e-5
  #   "T9/*": 0.10
  tolerance_overrides: {}

  # true: the reported value is rounded to the precision the task asks for before its
  # relative error is computed, so a value reported with more digits than requested
  # is graded as the value the task asked for.
  round_to_required_precision: true

  # Rankings, yes/no answers, dates and month indices are graded by exact match only
  # and never enter the relative error. false leaves them out entirely, so only the
  # numeric values are graded.
  include_non_numeric: true

  # Items excluded from scoring, as "<task>/<item id>" patterns with wildcards, e.g.
  #   - "T1/monthly_std_degC.*"
  exclude_items: []

  # The relative error counted for a value the answer does not report. null leaves
  # such items out of the relative-error mean (accuracy still counts them as wrong);
  # a number, e.g. 1.0, counts each as that relative error.
  missing_relative_error: null

extractor:
  # The answers are free text, so a language model reads each one and copies out the
  # value it reports for every graded item. It never sees the reference values. Use
  # a model other than the one under evaluation where possible.
  #
  # Same keys as the llm section of configs/agent_full.yaml; the provider table
  # is in src/models/llm_providers.py. The key is read from the environment variable
  # (DEEPSEEK_API_KEY for deepseek), never from this file.
  llm:
    provider: deepseek
    model_name: deepseek-v4-pro
    temperature: 0.0
    base_url: null
    api_key_env: null
    max_tokens: null
    timeout: 600         # seconds allowed for one request
    max_retries: 2       # client retries on a transport or rate-limit failure
    # Accept-Encoding: gzip keeps the server from sending brotli, which the installed
    # Brotli 1.0.9 cannot decode under httpx2 ("process() takes no keyword arguments",
    # reported as "Connection error").
    extra_params:
      default_headers:
        Accept-Encoding: gzip

  # Times a reply is asked for again when it cannot be read as the expected JSON.
  retries: 2

  # Answers read in parallel.
  max_workers: 4

  # true: a run whose answer file, graded items and extractor model are unchanged
  # since the last evaluation reuses the values extracted then, so changing only
  # the scoring settings above makes no model calls. false re-reads every answer.
  reuse_extraction: true

# Runtime configuration for the direct-LLM baseline,
# src/models/direct_llm/agent_direct_llm.py: no tools, no knowledge, no planning.
#
# The model, the loop limits (max_code_iterations is the repair budget here too)
# and the batch come from configs/agent_full.yaml, so every arm of the
# comparison runs under the same settings. This file overrides only what has to differ.

extends: agent_full.yaml

arm: direct_llm

agent:
  result_dir: ./results/deepseek-v4.1-flash_kbstripped_direct_llm_20261022

knowledge:
  enabled: false

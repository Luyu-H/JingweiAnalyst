# Runtime configuration for the knowledge ablation (-K): the full agent, with its
# tools, and no knowledge retrieval. Run the case batch with
#
#   python -m src.models.agent_with_tools --config configs/agent_with_tools_no_knowledge.yaml
#
# The ablation must differ from the full agent in its knowledge and nothing else,
# so this file extends configs/agent_full.yaml and overrides only what has
# to differ.

extends: agent_full.yaml

arm: no_knowledge

agent:
  result_dir: ./results/deepseek-v4.1-flash_kbstripped_no_knowledge_20261020

knowledge:
  enabled: false

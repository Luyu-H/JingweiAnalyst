# Paths to supporting resources. The data sources themselves are registered in
# datasets.yaml, in this directory.
#
# The area_cache_*.npz files under cache_dir must be built on a 0~360 longitude
# grid. src/utils/geo_processor.fix_longitudes_and_split converts the Natural
# Earth geometries to 0~360, so intersecting them with a -180~180 grid drops
# every cell in the western hemisphere (the symptom: the North Atlantic Ocean
# mask keeps only 83 cells). A cache file is named for its resolution alone
# (360x180) and not for its longitude convention, so a cache built under the
# other convention must be deleted by hand; build_caches silently reuses it
# otherwise.

cache_dir: /home/lorraine/projects/2025-jingwei_QA_GMD/cache
natural_earth_path: /home/lorraine/projects/2025-jingwei_QA_GMD/assets/NaturalEarth

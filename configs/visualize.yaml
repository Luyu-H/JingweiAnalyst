# Configuration for src/eval/visualize.py, which draws the evaluation figures from the
# score files in the results folders:
#
#   python -m src.eval.visualize
#   python -m src.eval.visualize --only a_portrait_llms e_loss_sources
#
# Relative paths are resolved against the repository root, not the working directory.

# Every figure is written as <output_dir>/<figure name>.<format>, and again as
# <figure name>_notext.<format> with every text element hidden and nothing else changed.
output_dir: ./results/figures

formats: [pdf, png]
dpi: 600

font:
  family: [Arial, Liberation Sans, DejaVu Sans]
  size: 8

portrait_colors:
  cmap: cividis
  bounds: null

sd_over: repeats

difficulty_levels:
  level1: [T1, T2]
  level2: [T3, T4]
  level3: [T5, T6, T7]
  level4: [T8, T9, T10]

entries:
  # The LLM comparison takes DeepSeek's first round only, as Claude and GPT ran once:
  # evaluation_round1.json scores the first run of every task.
  deepseek_full:
    label: DeepSeek-V4.1-Flash
    dir: ./results/deepseek-v4.1-flash_kbstripped_full_20261020
    files: {evaluation: evaluation_round1.json}
    color: "#0072B2"
    marker: o
  claude_full:
    label: Claude Sonnet 5.5
    dir: ./results/claude-sonnet-5-5_kbstripped_full_20261024
    color: "#E69F00"
    marker: s
  gpt_full:
    label: GPT-5.4
    dir: ./results/gpt-5.4_kbstripped_full_20261024
    color: "#CC79A7"
    marker: "^"

  # The ablation takes every repeat: evaluation_all_runs.json scores all of them, as the
  # figure, report and loss files do (evaluation.json predates the repeats).
  deepseek_direct_llm:
    label: Direct LLM
    dir: ./results/deepseek-v4.1-flash_kbstripped_direct_llm_20261022
    files: {evaluation: evaluation_all_runs.json}
    color: "#000000"
    marker: v
  deepseek_no_tools:
    label: "−T"
    dir: ./results/deepseek-v4.1-flash_kbstripped_no_tools_20261022
    files: {evaluation: evaluation_all_runs.json}
    color: "#CC79A7"
    marker: D
  deepseek_no_knowledge:
    label: "−K"
    dir: ./results/deepseek-v4.1-flash_kbstripped_no_knowledge_20261020
    files: {evaluation: evaluation_all_runs.json}
    color: "#E69F00"
    marker: "^"
  deepseek_ablation_full:
    label: Full
    dir: ./results/deepseek-v4.1-flash_kbstripped_full_20261020
    files: {evaluation: evaluation_all_runs.json}
    color: "#0072B2"
    marker: o

figures:
  a_portrait_llms:
    kind: portrait
    title: Scores by LLM, full framework
    rows: [deepseek_full, claude_full, gpt_full]
    columns: [rc, acc, figure_completeness, figure_quality, report_completeness, report_quality]
    annotate: mean

  b_accuracy_by_level_llms:
    kind: level_lines
    title: Accuracy by difficulty level
    series: [deepseek_full, claude_full, gpt_full]
    metric: acc
    band: none

  c_portrait_ablation:
    kind: portrait
    title: Ablation, DeepSeek-V4.1-Flash
    rows: [deepseek_direct_llm, deepseek_no_tools, deepseek_no_knowledge, deepseek_ablation_full]
    columns: [rc, acc, figure_completeness, figure_quality, report_completeness, report_quality]
    annotate: mean_sd

  d_accuracy_by_level_ablation:
    kind: level_lines
    title: Accuracy by level, ablation
    series: [deepseek_direct_llm, deepseek_no_tools, deepseek_no_knowledge, deepseek_ablation_full]
    metric: acc
    band: sd

  e_loss_sources:
    kind: loss_bars
    title: Sources of lost items
    bars: [deepseek_direct_llm, deepseek_no_tools, deepseek_no_knowledge, deepseek_ablation_full]
    categories: ["1", "2", "3", "4", "5"]
    show_total: true

  e_loss_sources_with_details:
    kind: loss_bars
    title: Sources of lost items
    bars: [deepseek_direct_llm, deepseek_no_tools, deepseek_no_knowledge, deepseek_ablation_full]
    categories: ["1", "2", "3", "4", "5"]
    show_total: true
    label_parts: 0.005

  e2_loss_events:
    kind: loss_bars
    measure: events
    title: Loss events by cause
    bars: [deepseek_direct_llm, deepseek_no_tools, deepseek_no_knowledge, deepseek_ablation_full]
    categories: ["1", "2", "3", "4", "5"]

  f_llm_time_llms:
    kind: llm_time_bars
    title: LLM time by call type
    bars: [deepseek_full, claude_full, gpt_full]
    sd_over: tasks
    show_total: true
    wrap_labels: 11
    axes_size: [3.5, 2.02]
    bar_width: 0.5

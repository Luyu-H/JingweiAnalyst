# Runtime configuration for src/models/agent_with_tools.py
#
# Relative paths are resolved against the repository root, not the working
# directory, so a run behaves the same from anywhere.


arm: full

llm:
  provider: deepseek
  model_name: deepseek-flash

  # null sends no temperature at all, which is what the reasoning models
  # (o-series, gpt-5, and anything that thinks before answering) require.
  temperature: 0.0

  # Left out, each provider uses its own endpoint and key variable. Set base_url
  # for a proxy, a self-hosted server, or a regional endpoint - Qwen's mainland
  # China accounts, for instance, use
  # https://dashscope.aliyuncs.com/compatible-mode/v1
  base_url: null

  # The key is always read from an environment variable, never stored in the repo:
  #   export DEEPSEEK_API_KEY=...
  api_key_env: null

  # Optional client settings; null leaves the provider default in place. Claude is
  # given 8192 output tokens by default, because its client's own 1024 truncates
  # generated code mid-function.
  max_tokens: null
  timeout: null        # seconds allowed for one request
  max_retries: 2       # retries on a transport/rate-limit failure

  # Anything else this vendor's LangChain client accepts, passed through verbatim
  # (e.g. {reasoning_effort: high} for OpenAI, {thinking: {...}} for Claude).
  extra_params:
    default_headers:
      Accept-Encoding: "gzip, deflate"

agent:
  result_dir: ./results/deepseek-v4.1-flash_kbstripped_full_20261020

  # A session refuses further questions once this many turns have been answered.
  max_turns_per_session: 10

  # Attempts allowed per code step: the first generation plus its repairs.
  max_code_iterations: 3

  # 'auto' reads the question's script and answers in kind; 'zh' or 'en' force it.
  language: auto

  # Turns of earlier conversation replayed into the planning prompt.
  context_history_turns: 3

  # Resolution of every saved figure, including the ones a rerun harness redraws.
  figure_dpi: 300

  # How the executed code's variables are condensed before the solution step sees
  # them; the model reasons over this summary, not the raw arrays.
  observation:
    # Arrays no larger than this are listed in full; larger ones become statistics.
    max_array_elements: 50
    # Everything rendered as text is cut to this many characters.
    max_value_chars: 800
    materialize_max_mb: 2048
    materialize_total_mb: 16384

knowledge:
  enabled: true
  root: docs/knowledge
  # Run the catalogue checks of `python -m src.docs.knowledge_index --check` at
  # start-up and refuse to start on a problem.
  validate_on_start: true

  # R1: every fragment is scored against the question from its front matter.
  prefilter:
    # How many of the best-scored fragments the selector is shown.
    max_candidates: 30
    severity_weights: {must: 1.0, should: 0.6, info: 0.3}
    # Variable names that are also English words: they count only when the
    # question writes them as names, in backticks.
    backtick_only_variables: [so, ph, si, talk]
    dataset_aliases:
      cmip6_historical: [historical]
      cmip6_ssp245: [ssp245, SSP2-4.5]
      woa23: [WOA23, World Ocean Atlas]
      glodap: [GLODAP, GLODAPv2]
      ersst: [ERSST, ERSSTv5]
      seanoe_mld: [SEANOE]
      cpc_indices: [CPC]

  # R2a: which fragments may apply is decided by a language model reading the
  # candidates' summaries. Meant not to miss; R2b drops what does not apply.
  selector:
    # llm | lexical. lexical takes the prefilter's best fallback_top_k, makes no
    # model call at all.
    mode: llm
    max_selected: 8
    # Taken from the prefilter when the selector's answer has no
    # <selected_knowledge> tag or the call fails, and always in lexical mode.
    fallback_top_k: 4
    # Times either knowledge call is asked again when its answer cannot be read.
    retries: 1
    # The model for both knowledge calls, selection and condensing. null asks the
    # same model as the 'llm' section.
    llm: null

  # R2b: a second call reads the full text of the selected fragments and keeps only
  # what applies to this question, as a few one-line notes per fragment.
  condense:
    enabled: true          # false: the planner gets the sections under 'injection' instead
    source_sections:
      must:   [key_points, implications, common_mistakes]
      should: [key_points, implications, common_mistakes]
      info:   [key_points, implications]
    max_notes_per_fragment: 2
    # Budget for everything the planner is shown.
    max_chars: 3600
    # Calendar counts a note may use although the fragment does not spell them out
    # (12 months, 365 days, ...). Every other number must occur in the fragment or
    # the question.
    always_allowed_numbers: [12, 24, 28, 29, 30, 31, 60, 360, 365, 366]

  injection:
    max_chars: 16000
    sections:
      must: [key_points, implications, common_mistakes]
      should: [implications, common_mistakes]
      info: [summary, implications]

  # R4: the plan is asked to cite every must fragment it was shown as [fragment-id],
  # with one note line per fragment.
  plan_check:
    on_uncited_must: warn  # warn | ignore; either way the result is in knowledge.json

batch_run:
  # Used only when the module is run as a script.
  # Every *.json file in this folder is read as a list of {"query": ...} items
  # The archived experiment ran one task at a time from temporary sweep folders
  # (repeats: 1 per invocation), producing three runs of each of the ten tasks.
  # Use the current task folder for the equivalent three-round batch.
  test_folder: cases/tasks
  repeats: 3
